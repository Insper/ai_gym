name: Lint and Test on Pull Request
on:
  pull_request:
    branches:
      - '**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Install graphviz, dependencies and virtual display
      run: sudo apt-get update && sudo apt-get install -y graphviz libegl1 libgl1 libxkbcommon-x11-0 xvfb

    - name: Run pylint
      run: pylint aigyminsper --fail-under=9.0

    - name: Run tests
      # Running with a virtual display
      run: xvfb-run -a pytest